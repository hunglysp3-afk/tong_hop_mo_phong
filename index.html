        :root {
            --bg-color: #f4f6fa;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --radius: 16px;
            --shadow: 0 4px 14px rgba(0, 0, 0, 0.05);
            --shadow-hover: 0 10px 25px rgba(37, 99, 235, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 16px 40px;
        }

        .container {
            width: 100%;
            max-width: 900px;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .badge-main {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #e0e7ff;
            color: #4338ca;
            font-size: 13px;
            font-weight: 600;
            padding: 5px 14px;
            border-radius: 999px;
            margin-bottom: 12px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 800;
            color: #0f172a;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        .header p {
            color: var(--text-muted);
            font-size: 15px;
            font-weight: 400;
        }

        /* Controls: Search & Tabs */
        .controls-wrapper {
            background: var(--card-bg);
            padding: 16px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            margin-bottom: 24px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .search-box {
            position: relative;
            width: 100%;
        }

        .search-box i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 15px;
        }

        .search-input {
            width: 100%;
            padding: 12px 14px 12px 42px;
            border-radius: 12px;
            border: 1.5px solid var(--border-color);
            background: #f8fafc;
            font-size: 14.5px;
            color: var(--text-main);
            outline: none;
            transition: all 0.2s ease;
        }

        .search-input:focus {
            background: #ffffff;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        /* Filter Tabs */
        .tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .tab-btn {
            background: #f1f5f9;
            border: none;
            outline: none;
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 13.5px;
            font-weight: 600;
            color: #475569;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .tab-btn:hover {
            background: #e2e8f0;
            color: #1e293b;
        }

        .tab-btn.active {
            background: var(--primary);
            color: #ffffff;
        }

        .tab-btn .count {
            background: rgba(0, 0, 0, 0.08);
            padding: 2px 7px;
            border-radius: 999px;
            font-size: 11.5px;
        }

        .tab-btn.active .count {
            background: rgba(255, 255, 255, 0.25);
            color: #ffffff;
        }

        /* Simulation Grid */
        .simulation-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        @media (max-width: 720px) {
            .simulation-grid {
                grid-template-columns: 1fr;
            }
            .header h1 {
                font-size: 23px;
            }
        }

        /* Simulation Card */
        .sim-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 16px 18px;
            text-decoration: none;
            color: inherit;
            display: flex;
            align-items: center;
            gap: 16px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
        }

        .sim-card::before {
            content: "";
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 5px;
            background: var(--theme-color, #2563eb);
            border-top-left-radius: var(--radius);
            border-bottom-left-radius: var(--radius);
        }

        .sim-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-hover);
            border-color: #cbd5e1;
        }

        .sim-card:hover .sim-arrow {
            transform: translateX(4px);
            color: var(--primary);
        }

        /* Icon Container */
        .sim-icon-box {
            width: 48px;
            height: 48px;
            min-width: 48px;
            border-radius: 14px;
            background: var(--theme-bg, #eff6ff);
            color: var(--theme-color, #2563eb);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 21px;
            transition: transform 0.2s ease;
        }

        .sim-card:hover .sim-icon-box {
            transform: scale(1.08);
        }

        /* Content info */
        .sim-info {
            flex: 1;
            min-width: 0;
        }

        .sim-badges {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 5px;
        }

        .badge-grade {
            font-size: 11px;
            font-weight: 700;
            padding: 2px 7px;
            border-radius: 6px;
            background: #f1f5f9;
            color: #475569;
            text-transform: uppercase;
        }

        .badge-grade.g10 {
            background: #dcfce7;
            color: #15803d;
        }

        .badge-grade.g11 {
            background: #e0f2fe;
            color: #0369a1;
        }

        .badge-grade.g12 {
            background: #fef3c7;
            color: #b45309;
        }

        .badge-tag {
            font-size: 11px;
            font-weight: 600;
            padding: 2px 6px;
            border-radius: 6px;
            background: #f3f4f6;
            color: #6b7280;
        }

        .sim-title {
            font-size: 15.5px;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 4px;
            line-height: 1.35;
        }

        .sim-desc {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .sim-arrow {
            color: #cbd5e1;
            font-size: 14px;
            transition: all 0.2s ease;
            margin-left: 4px;
        }

        /* Empty State */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 45px 20px;
            background: var(--card-bg);
            border-radius: var(--radius);
            color: var(--text-muted);
            border: 1px dashed var(--border-color);
        }

        .empty-state i {
            font-size: 38px;
            color: #cbd5e1;
            margin-bottom: 12px;
        }

        .empty-state p {
            font-size: 15px;
        }

        /* Footer */
        .footer {
            margin-top: 45px;
            text-align: center;
            color: #94a3b8;
            font-size: 13px;
            line-height: 1.6;
        }

        .footer strong {
            color: #64748b;
        }

        .footer-line {
            width: 40px;
            height: 2px;
            background: #e2e8f0;
            margin: 0 auto 12px;
            border: none;
        }
    </style>
</head>

// Biến lưu trạng thái lọc
let currentFilter = "all";
let searchQuery = "";

// Cập nhật số lượng đếm trên Tabs
function updateCounts() {
    document.getElementById("countAll").textContent = SIMULATIONS.length;
    document.getElementById("count10").textContent = SIMULATIONS.filter(s => s.grade === "10").length;
    document.getElementById("count11").textContent = SIMULATIONS.filter(s => s.grade === "11").length;
    document.getElementById("count12").textContent = SIMULATIONS.filter(s => s.grade === "12").length;
}

// Hàm render danh sách thẻ bài học
function renderCards() {
    const grid = document.getElementById("simGrid");
    grid.innerHTML = "";

    const filtered = SIMULATIONS.filter(sim => {
        const matchFilter = (currentFilter === "all") || (sim.grade === currentFilter);
        const q = searchQuery.toLowerCase().trim();
        const matchSearch = !q || 
            sim.title.toLowerCase().includes(q) || 
            sim.desc.toLowerCase().includes(q) ||
            sim.grade.includes(q) ||
            (sim.tag && sim.tag.toLowerCase().includes(q));

        return matchFilter && matchSearch;
    });

    if (filtered.length === 0) {
        grid.innerHTML = `
            <div class="empty-state">
                <i class="fa-solid fa-box-open"></i>
                <p>Không tìm thấy bài mô phỏng nào phù hợp với từ khóa "<strong>${searchQuery}</strong>".</p>
            </div>
        `;
        return;
    }

    filtered.forEach(item => {
        const themeConfig = COLOR_THEMES[item.theme] || COLOR_THEMES.blue;
        const card = document.createElement("a");
        card.href = item.file;
        card.className = "sim-card";
        card.style.setProperty("--theme-color", themeConfig.color);
        card.style.setProperty("--theme-bg", themeConfig.bg);

        card.innerHTML = `
            <div class="sim-icon-box">
                <i class="${item.icon}"></i>
            </div>
            <div class="sim-info">
                <div class="sim-badges">
                    <span class="badge-grade g${item.grade}">Lớp ${item.grade}</span>
                    ${item.tag ? `<span class="badge-tag">${item.tag}</span>` : ""}
                </div>
                <div class="sim-title">${item.title}</div>
                <div class="sim-desc">${item.desc}</div>
            </div>
            <div class="sim-arrow">
                <i class="fa-solid fa-chevron-right"></i>
            </div>
        `;
        grid.appendChild(card);
    });
}

// Xử lý sự kiện Tabs
document.querySelectorAll(".tab-btn").forEach(btn => {
    btn.addEventListener("click", () => {
        document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentFilter = btn.getAttribute("data-filter");
        renderCards();
    });
});

// Xử lý ô tìm kiếm
document.getElementById("searchInput").addEventListener("input", (e) => {
    searchQuery = e.target.value;
    renderCards();
});

// Khởi chạy ban đầu
updateCounts();
renderCards();
</script>
